# Aura Watch-Together relay — Cloudflare Worker config.
# Deploy:  npx wrangler deploy   (see README.md)

name = "aura-watch-relay"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# The Room Durable Object holds each party's WebSocket connections.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed Durable Objects — the storage backend that is eligible on the
# Workers Free plan (key-value DOs require the $5/mo Paid plan). The relay only
# stashes a tiny per-room playback-state blob, so SQLite is plenty.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Optional access token — set it as a SECRET, not here:
#   npx wrangler secret put APP_TOKEN
# then put the same value in Aura → Settings → Watch Together.
