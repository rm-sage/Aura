# src-tauri/permissions/player.toml

# ── Playback ──────────────────────────────────────────────────────────────────
[[permission]]
identifier = "allow-load-video"
description = "Allows the frontend to load a video file into the MPV engine"
commands.allow = ["load_video", "stop_video"]

[[permission]]
identifier = "allow-player-controls"
description = "Allows the frontend to toggle pause, seek, set volume / speed, switch audio + subtitle tracks, query state, apply language defaults, and flag an in-sync watch-party member so minimise does not pause it"
commands.allow = [
  "toggle_pause",
  "set_keep_display_awake",
  "seek_relative",
  "frame_step",
  "set_audio_loudnorm",
  "set_motion_interpolation",
  "extract_thumbnail",
  "seek_absolute",
  "set_volume",
  "set_speed",
  "set_audio_track",
  "set_audio_delay",
  "set_subtitle_track",
  "set_subtitle_delay",
  "set_subtitle_speed",
  "set_subtitle_visibility",
  # Live subtitle sync: read the cue list of the active subtitle track so the
  # user can click the line they just heard. External tracks parse straight
  # from the .srt/.vtt/.ass we already have; embedded tracks come out of a
  # windowed ffmpeg extraction.
  "parse_subtitle_cues",
  "extract_embedded_cues",
  "probe_subtitle_streams",
  # Story arcs: TMDB episode groups, joined to the addon's episode ids.
  "fetch_story_arcs",
  "story_arcs_available",
  "set_panscan",
  "get_tracks",
  "get_property",
  "refresh_video",
  "apply_lang_defaults",
  "apply_hdr_settings",
  "apply_subtitle_style",
  "set_subtitle_position_runtime",
  "set_native_fullscreen",
  "set_party_keep_alive",
  "save_screenshot",
  "set_video_eq",
  "apply_buffer_settings",
]

# ── Casting (Chromecast + DLNA) ───────────────────────────────────────────────
[[permission]]
identifier = "allow-cast"
description = "Allows the frontend to discover LAN cast devices (Chromecast/DLNA), start/stop cast sessions, and control cast playback"
commands.allow = [
  "cast_discover",
  "cast_load",
  "cast_play",
  "cast_pause",
  "cast_seek",
  "cast_stop",
  "cast_status",
  "cast_ffmpeg_present",
]

# ── On-demand runtime binaries (ffmpeg/ffprobe) ───────────────────────────────
[[permission]]
identifier = "allow-runtime-deps"
description = "Allows the frontend to check for + download/verify on-demand runtime binaries (ffmpeg/ffprobe for silence detection + casting; libmpv for the playback engine), and to (re)start the playback engine after the first-run libmpv download"
commands.allow = ["ensure_runtime_dep", "runtime_dep_present", "playback_engine_ready", "ensure_playback_engine"]

# ── Trailer resolution (yt-dlp) ───────────────────────────────────────────────
[[permission]]
identifier = "allow-trailer"
description = "Allows the frontend to resolve a YouTube trailer id to a direct CDN URL via yt-dlp for in-player trailer playback"
commands.allow = ["resolve_trailer_url"]

# ── Live TV (IPTV) ────────────────────────────────────────────────────────────
[[permission]]
identifier = "allow-iptv"
description = "Allows the frontend to fetch IPTV playlists / EPG / Xtream API responses through the backend (IPTV-client UA, size-capped) and store Xtream passwords in the OS keyring"
commands.allow = [
  "iptv_fetch_text",
  "iptv_set_xtream_password",
  "iptv_get_xtream_password",
  "iptv_clear_xtream_password",
]

# ── Stremio catalog ───────────────────────────────────────────────────────────
[[permission]]
identifier = "allow-fetch-catalog"
description = "Allows the frontend to fetch items for a specific Stremio catalog"
commands.allow = ["fetch_catalog", "fetch_catalog_paginated"]

[[permission]]
identifier = "allow-addon-manifest"
description = "Allows the frontend to retrieve an addon's full manifest (including the cache-bypass `refresh_addon_manifest` variant used by the per-addon Refresh button)"
commands.allow = ["get_addon_manifest", "refresh_addon_manifest"]

# ── Addon management ──────────────────────────────────────────────────────────
[[permission]]
identifier = "allow-addon-management"
description = "Allows the frontend to add, remove, list, and reorder persisted addons (guest mode)"
commands.allow = ["add_addon", "remove_addon", "list_addons", "reorder_addons"]

# ── Authentication ────────────────────────────────────────────────────────────
[[permission]]
identifier = "allow-auth"
description = "Allows the frontend to login, logout, and retrieve the current Stremio session"
commands.allow = ["login", "logout", "get_session", "get_synced_addons", "backfill_user_id", "fetch_stremio_account", "stremio_link_create", "stremio_link_poll"]

# ── Global search & cloud sync (2.3) ──────────────────────────────────────────
[[permission]]
identifier = "allow-global-search"
description = "Allows the frontend to run a concurrent global search across all search-enabled addons"
commands.allow = ["global_search_grouped", "search_addon_grouped", "fetch_search_catalog_expanded"]

[[permission]]
identifier = "allow-cloud-sync"
description = "Allows the frontend to add, remove, and reorder addons in the user's Stremio cloud account"
commands.allow = ["cloud_add_addon", "cloud_remove_addon", "cloud_reorder_addons"]

# ── Streaming bridge (2.4) ────────────────────────────────────────────────────
[[permission]]
identifier = "allow-streaming-bridge"
description = "Allows the frontend to resolve stream URLs through the local bridge proxy"
commands.allow = ["resolve_stream"]

# ── Cinema Suite (2.6) ───────────────────────────────────────────────────────
[[permission]]
identifier = "allow-cinema-suite"
description = "Allows the frontend to control shader profiles and read OSD stats"
commands.allow = ["list_shader_profiles", "set_shader_profile", "get_shader_profile"]

# ── Phase 3B: meta detail & library sync ─────────────────────────────────────
[[permission]]
identifier = "allow-meta-detail"
description = "Allows the frontend to fetch full meta detail for an addon item"
commands.allow = ["fetch_meta_detail"]

[[permission]]
identifier = "allow-library-sync"
description = "Allows the frontend to read and write the user's Stremio library (Continue Watching + Library)"
commands.allow = ["library_get", "library_put"]

# ── Platform probe (Win10 vs Win11 drag gating) ──────────────────────────────
# Read once at startup by TitleBar.tsx to pick the window-drag strategy: Win10
# uses a custom coalesced pointer-drag (the native caption-drag modal loop
# stalls on Win10's DWM + weak GPUs), Win11 keeps native startDragging.
[[permission]]
identifier = "allow-platform"
description = "Allows the frontend to query basic host platform facts (whether the OS is Windows 10 vs 11) to gate platform-specific UI behavior"
commands.allow = ["is_windows_10"]

# ── Phase 3B: app settings (theme, defaults) ─────────────────────────────────
[[permission]]
identifier = "allow-settings"
description = "Allows the frontend to read and update persistent app settings (theme, defaults, RPC, window, keybindings, subtitle keys)"
commands.allow = ["get_settings", "set_theme", "update_settings", "reset_settings", "set_settings_scope"]

# ── AuraSkip (skip-window aggregate + AniSkip API + silence detection) ──────
# Identifier kept as `allow-aniskip` for stability (renaming it would mean a
# matching edit in capabilities/default.json and a silent-401 risk if missed);
# the surface it gates is the whole AuraSkip umbrella, not just AniSkip.
[[permission]]
identifier = "allow-aniskip"
description = "Allows the frontend to drive AuraSkip: stamp/read the aggregate skip-time windows, fetch op/ed/recap windows from the AniSkip API, and run the silence/outro auto-detection used for anime and any series"
commands.allow = ["fetch_skip_windows", "fetch_neighbour_skip_profile", "set_skip_windows", "get_skip_windows", "resolve_mal_id", "resolve_mal_id_by_title", "detect_silence_intervals", "detect_outro_boundary", "submit_skip_time", "vote_skip_time", "resolve_cour_mal_id", "resolve_cour_anilist_id", "resolve_anilist_to_mal", "resolve_mal_for_aniskip"]

# ── publicmetadb (crowd-sourced OP/ED skip source) ──────────────────────────
[[permission]]
identifier = "allow-publicmetadb"
description = "Allows the frontend to fetch crowd-sourced OP/ED skip windows from publicmetadb and to resolve an anime TMDB id for that lookup"
commands.allow = ["fetch_publicmetadb_skips", "resolve_anime_tmdb_id"]

# ── Phase 4: OpenSubtitles ────────────────────────────────────────────────────
[[permission]]
identifier = "allow-subtitles"
description = "Allows the frontend to search OpenSubtitles, download .srt files, and inject them into MPV"
commands.allow = ["search_subtitles", "download_subtitle", "add_subtitle_to_mpv", "compute_opensubtitles_hash"]

# ── API keys (OS keyring) ────────────────────────────────────────────────────
[[permission]]
identifier = "allow-api-keys"
description = "Allows the Settings UI to read / write / clear third-party API keys (OpenSubtitles) stored in the OS keyring"
commands.allow = ["get_api_key", "set_api_key", "clear_api_key"]

# ── Multi-source ratings aggregator ─────────────────────────────────────────
[[permission]]
identifier = "allow-aggregate-ratings"
description = "Allows the frontend to query MDBList + Jikan (MAL) + AniList and any other ratings backend Aura adds, returning a unified list"
commands.allow = ["fetch_aggregate_ratings"]

# ── Accurate movie release dates (MDBList Digital/Theatrical) ────────────────
[[permission]]
identifier = "allow-release-dates"
description = "Allows the frontend to fetch accurate movie Digital + Theatrical release dates from MDBList (drives the Digital countdown and the In Theaters tag)"
commands.allow = ["fetch_movie_release_dates"]

# ── Landscape (16:9) art resolution via AIOMeta ─────────────────────────────
[[permission]]
identifier = "allow-landscape-art"
description = "Allows the frontend to resolve 16:9 landscape art for a title via the user's AIOMeta addon, for Continue Watching cards"
commands.allow = ["fetch_landscape_art"]

# ── User-data backups (Queue / History / manual marks / settings snapshot) ──
[[permission]]
identifier = "allow-user-backups"
description = "Allows the frontend to create, list, read, and delete on-disk snapshots of the user's localStorage-backed data"
commands.allow = [
  "create_user_backup",
  "list_user_backups",
  "read_user_backup",
  "delete_user_backup",
  "user_backup_storage_used",
]

# ── Phase 4: SMTC (Windows media controls) ───────────────────────────────────
[[permission]]
identifier = "allow-smtc"
description = "Allows the frontend to push now-playing metadata + playback state to Windows SMTC"
commands.allow = ["smtc_set_metadata", "smtc_set_playback", "smtc_clear"]

# ── Phase 5: stream aggregation ──────────────────────────────────────────────
[[permission]]
identifier = "allow-stream-fetch"
description = "Allows the frontend to fetch per-meta streams across all installed addons"
commands.allow = ["fetch_streams"]

# ── Phase 5.5: external subtitles fan-out ────────────────────────────────────
[[permission]]
identifier = "allow-external-subtitles"
description = "Allows the frontend to fetch external subtitle URLs from installed subtitle-resource addons"
commands.allow = ["fetch_external_subtitles"]

# ── Phase 3C: scrobbling (AIOMetadata) ───────────────────────────────────────
[[permission]]
identifier = "allow-scrobble"
description = "Allows the frontend to fire scrobble Start/Heartbeat/End events to the configured AIOMetadata addon, plus a DevConsole-only manual test trigger that re-fires the same provider dispatch against the active session without consuming it."
commands.allow = ["scrobble_start", "scrobble_heartbeat", "scrobble_end", "scrobble_test_fire", "scrobble_history_trakt", "scrobble_history_anilist", "set_scrobble_run_active"]

# ── Trakt + AniList direct-scrobble OAuth (replaces AIOMetadata) ─────────────
[[permission]]
identifier = "allow-scrobble-auth"
description = "Allows the frontend to read/write/clear OAuth tokens for the direct Trakt and AniList scrobble path, and to compute the authorize URL the user's browser should open."
commands.allow = [
  "get_scrobble_auth_status",
  "set_scrobble_auth_token",
  "clear_scrobble_auth_token",
  "scrobble_oauth_authorize_url",
  "scrobble_oauth_device_begin",
  "scrobble_oauth_device_poll",
  "open_oauth_popup_webview",
  "get_anilist_id_map",
  "set_anilist_id_map",
]

# ── Phase 3C: Discord Rich Presence ──────────────────────────────────────────
[[permission]]
identifier = "allow-discord-rpc"
description = "Allows the frontend to publish or clear Discord rich presence"
commands.allow = ["discord_set_presence", "discord_clear_presence"]

# ── Per-title persistence (volume / shader / audio / sub) ────────────────────
[[permission]]
identifier = "allow-per-title-state"
description = "Allows the frontend to read and write per-title playback preferences (volume, shader, audio language, subtitle language). Bulk get_all/set_all variants are used by the cloud sync layer (sync.rs) to round-trip the entire map for proxy storage."
commands.allow = ["get_title_state", "set_title_state", "get_all_title_state", "set_all_title_state"]

# ── Local stats (hours watched, etc.) ────────────────────────────────────────
[[permission]]
identifier = "allow-stats"
description = "Allows the frontend to read and bump local-only fun stats (hours watched, streams played)"
commands.allow = ["get_stats", "bump_stat"]

# ── Disk / cache storage management ──────────────────────────────────────────
[[permission]]
identifier = "allow-storage-management"
description = "Allows the frontend to inspect and clear Aura's on-disk caches and logs"
commands.allow = ["get_storage_report", "clear_storage_item"]

# ── DevConsole tools (debug commands) ──────────────────────────────────────
# `dev_force_panic` is the only entry today — invoked from DevConsole's
# `panic` command to verify the Sentry crash-reporting pipeline. The
# command deliberately crashes a worker thread; consumers should treat
# it accordingly (no production code should ever call it).
[[permission]]
identifier = "allow-dev-tools"
description = "Allows the frontend to invoke DevConsole-only debug commands (e.g. force-panic for Sentry verification)"
commands.allow = ["dev_force_panic"]

# ── Settings → Debug Stuff (engine + mpv diagnostics + drop-rate test) ─────
# Surface live mpv2 engine state, the parent window's foreground / visibility
# / cloak status, current mpv property snapshot (codec, hwdec, HDR/DV detection,
# drop counters), and a timed drop-rate test the user runs to validate
# off-focus-drop behaviour. Read-only / observation-only on the engine side;
# the drop test only reads counters.
[[permission]]
identifier = "allow-debug-panel"
description = "Allows the frontend Settings → Debug Stuff panel to read engine + mpv diagnostics and run drop-rate tests"
commands.allow = ["debug_engine_state", "debug_drop_test", "debug_load_test_pattern", "debug_stop_playback"]

# ── Popup webview navigation ───────────────────────────────────────────────
# Drives the Back / Forward / Refresh / address-bar controls in the in-app
# SourcePopup chrome strip. Rust-side commands look up the popup webview
# by label (gated to the `aura-source-popup-` prefix) and call eval with
# the corresponding `history.back()` / `history.forward()` /
# `location.reload()` / `location.assign(url)`. URL navigation re-
# validates the scheme on the Rust side (http/https only) so a malicious
# js:// or file:// can't be smuggled past the frontend guard.
# `popup_webview_current_url` is a pure read of the webview's live URL
# (WebView2 Source) that the chrome strip polls to keep the address bar
# in sync as the user clicks through pages inside the popup.
[[permission]]
identifier = "allow-popup-nav"
description = "Allows the SourcePopup chrome strip to drive back/forward/refresh/navigate against its own child webview, and to read its current URL for the address bar"
commands.allow = [
  "popup_webview_back",
  "popup_webview_forward",
  "popup_webview_reload",
  "popup_webview_navigate",
  "popup_webview_current_url",
]

# ── Aura Proxy v2: per-account cloud sync ──────────────────────────────────
# Round-trips per-account state (settings, manual marks, queue, recent
# searches, per-title preferences, AniList ID cache) through the
# aura.animasec.dev proxy under a sha256-derived scope hash. Library
# data continues to ride on Stremio's own cloud. See sync.rs for the
# full namespace list and ROADMAP §7 for the wire contract.
[[permission]]
identifier = "allow-sync"
description = "Allows the frontend to read and write per-account state through the Aura Proxy sync namespaces."
commands.allow = [
  "sync_status",
  "sync_pull",
  "sync_pull_all",
  "sync_push",
  "sync_delete",
  "sync_purge",
  "fetch_release_signal",
  "fetch_release_signals",
  "nudge_release_poller",
  "migrate_sync_scope",
]

# ── Crash reporting (Sentry consent + DSN, scope-independent) ──────────────
# Stored outside the per-account settings layer so opting in once
# applies to every Stremio account on the same install. See
# src-tauri/src/crash_reporting.rs for the storage layout.
[[permission]]
identifier = "allow-crash-reporting"
description = "Allows the frontend to read and write the global Sentry consent state and DSN"
commands.allow = ["get_crash_reporting", "set_crash_reporting"]

# ── DevConsole log export (Save-As dialog → text file write) ───────────────
# Used by the F12 DevConsole's Download button to dump the current log
# buffer to a user-chosen path. See src-tauri/src/log_export.rs.
[[permission]]
identifier = "allow-log-export"
description = "Allows the DevConsole to open a native Save-As dialog and write the log buffer to disk, and Settings to open a native folder picker"
commands.allow = ["save_text_with_dialog", "pick_folder"]
