[package]
name = "aura"
version = "1.5.0"
description = "Aura — Cinematic Media Player"
authors = ["rm-sage"]
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "aura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-opener = "2"
window-vibrancy = "0.5"
libloading = "0.8"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# gzip decompression for IPTV EPGs — many XMLTV guides are served as
# `.xml.gz` FILES (body is gzip, not Content-Encoding), so reqwest's
# transfer-decompression doesn't help; we detect the gzip magic + inflate.
flate2 = "1"
# Platform-native backends MUST be enabled explicitly — keyring v3
# ships no default features, so a bare `keyring = "3"` resolves to the
# in-memory mock backend that loses every value between app launches.
# That manifested as "I have to log into Stremio every time I start
# Aura". The three feature flags below pick the canonical OS keystore
# on each target:
#   • windows-native  → Windows Credential Manager (DPAPI-encrypted)
#   • apple-native    → macOS Keychain
#   • linux-native-sync-persistent → Linux Secret Service (sync API)
keyring = { version = "3", features = [
  "windows-native",
  "apple-native",
  "linux-native-sync-persistent",
] }
zeroize = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "macros", "process", "io-util", "time", "sync"] }
# In-process streaming bridge (streaming.rs) — the loopback byte-range /
# live proxy that used to live in the separate `aura-bridge` sidecar binary.
# axum pinned to 0.7 (0.8 changed wildcard route syntax). futures-util also
# enforces the IPTV fetch size-cap streaming.
axum = "0.7"
futures-util = "0.3"
# On-device poster resize-and-cache proxy (img_proxy.rs). Native decode of
# poster bytes so the WebView2 layer only ever textures card-sized images
# (the raw kitsu/anilist covers are 3+ MP). default-features off keeps the
# decoder set lean: posters are jpeg/png/webp; anything else fails the decode
# and the proxy degrades to a redirect to the original.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Casting (src/cast/): mDNS `_googlecast._tcp` discovery + a hand-rolled
# CASTV2 client (cast/castv2.rs — length-prefixed protobuf frames with
# JSON payloads; no protocol surface beyond what Aura uses). native-tls
# resolves to SChannel on Windows (cast devices use self-signed certs,
# so the connector accepts invalid certs for the LAN hop) — an accepted,
# cast-scoped divergence from the crate's otherwise-rustls posture.
# (rust_cast was rejected: it hard-depends on openssl-sys, which breaks
# Windows source builds without a system OpenSSL.)
native-tls = "0.2"
mdns-sd = "0.11"
tauri-plugin-deep-link = "2"
# Single-instance enforcement — required so OAuth deep-links route to
# the running Aura process instead of spawning a new one. Without this,
# the OS scheme handler (registered for `aura://` / `stremio://`)
# launches a fresh aura.exe per deep-link click, none of the instances
# end up showing the keyring update, and the user gets an extra zombie
# window. tauri-plugin-deep-link auto-detects single-instance and
# forwards the URL to the primary process when both are wired together
# (single-instance MUST be registered before deep-link in the plugin
# chain — see lib.rs).
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
# Auto-updater. Requires signed update payloads (signed via `pnpm tauri
# signer sign` at release time, verified with the public key set in
# tauri.conf.json under `plugins.updater.pubkey`). Without that key
# pair the plugin still loads but the checks return errors. See
# PRODUCTION.md for the full setup procedure.
tauri-plugin-updater = "2"
# Persists each window's last position + size to disk and restores on launch.
# Auto-listens to move/resize events; we wire it in lib.rs and call its
# `restore_state` setup hook so the main window opens at the user's last
# bounds before the loading screen paints.
tauri-plugin-window-state = "2"
discord-rich-presence = "0.2"
souvlaki = "0.7"
raw-window-handle = "0.5"
# SHA-256 — used by sync.rs to derive the per-account scope hash from
# the Stremio auth_key. The proxy never sees the raw auth_key; the hash
# is what authenticates every PUT/GET against the per-account blob set.
# Pulled at the smallest semver-compatible footprint (no asm/avx
# features) since hash throughput isn't on any hot path here.
sha2 = "0.10"
hex = "0.4"
# UUID v4 — used by aniskip.rs to mint the per-install submitterId
# AniSkip wants stamped on every POST /v2/skip-times submission. The
# id is persisted to <app_data>/aniskip-submitter-id.txt and reused
# across sessions so AniSkip's anti-spam dedupe sees a stable
# identity per Aura install.
uuid = { version = "1", features = ["v4"] }

# Crash & error reporting (opt-in via consent dialog at first run; see
# CrashReportingConsent.tsx + crash_reporting.rs).
# `default-features = false` peels off the default `native-tls` so the
# transport reuses the same `rustls` stack that reqwest is already
# pulling in (line 25). `panic` registers a panic hook, `backtrace`
# attaches stack frames, `contexts` adds OS/runtime info to events.
sentry = { version = "0.46", default-features = false, features = [
  "panic",
  "contexts",
  "backtrace",
  "reqwest",
  "rustls",
] }
# Native crash capture for the things the plain `sentry` crate can't
# see: SIGSEGV / STATUS_ACCESS_VIOLATION coming out of libmpv, the
# Crashpad-style segfault family. `sentry-rust-minidump` self-spawns
# the Aura executable in "crash reporter" mode (recognised by a
# private CLI flag the crate sets up); the reporter waits for a
# crash notification from the main process via IPC, captures a
# minidump, and uploads it to Sentry as an attachment alongside the
# panic-hook event. No external handler binary to bundle — the same
# binary plays both roles.
sentry-rust-minidump = "0.14"

# Windows shell COM bindings — used by win32.rs to signal fullscreen state
# to the taskbar via ITaskbarList2::MarkFullscreenWindow. The crate is
# already in our transitive dep graph (Tauri pulls it in at this exact
# version), so adding it as a direct dep with explicit features doesn't
# introduce a new compile-time cost.
#
# The Graphics_OpenGL / Graphics_Gdi / UI_WindowsAndMessaging /
# System_LibraryLoader features back the render-API rewrite's WGL path
# (mpv2::hello and later phases): the Win32 child window, the WGL pixel
# format + context, and the opengl32.dll proc-address fallback. They only
# add code-generation for symbols we reference — no extra runtime cost.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    # DwmGetWindowAttribute + DWMWA_CLOAKED — used by mpv2::engine to
    # detect whether the window is "actually visible" (not minimised,
    # not cloaked to a different virtual desktop) vs. only "not the
    # foreground window". A visible window on a second monitor while
    # the user works on the primary should keep full-quality vsync
    # rendering; only minimised / cloaked / hidden windows should drop
    # to the timer-paced background path.
    "Win32_Graphics_Dwm",
] }

# Dev-profile slimming. The default debug profile produced ~43 GB of
# target/ growth on this dep graph (Tauri framework + libmpv plugin +
# Sentry + reqwest+rustls + the windows crate's generated bindings,
# all built with full debug info per crate). Two changes here cut that
# by ~50% with zero impact on build speed and only a modest impact on
# Rust-side debugging fidelity:
#
#   • split-debuginfo = "packed" packages debug info into separate
#     .pdb files (Windows) / .dwo files (Linux) instead of duplicating
#     it inside every .rlib. Saves disk because each upstream crate is
#     no longer carrying a private copy of debug symbols already
#     emitted in its sibling rlibs.
#
#   • debug = "line-tables-only" keeps file:line information for
#     backtraces (so panic / unwind output is still useful) but drops
#     local variable type info that breakpoint debuggers consume.
#     Aura development is println!/devlog-driven; we don't run a Rust
#     debugger in the typical edit cycle. If you ever do, flip this
#     back to debug = true temporarily.
[profile.dev]
split-debuginfo = "packed"
debug = "line-tables-only"

# Release-profile debug info — needed for Sentry to symbolicate the
# minidumps captured by `sentry-rust-minidump`. Without this the PDB
# next to aura.exe contains no line-table info, and Sentry would
# render every native crash as raw addresses (`0x7FF6B4A91234`)
# instead of `lib.rs:1234`. "limited" produces line tables only
# (no full type info), which keeps the PDB ~3-5 MB instead of 30+ MB
# while still resolving to source locations. `strip = false`
# preserves the symbol table in the EXE itself for backtrace fallback.
[profile.release]
debug = "limited"
strip = false
