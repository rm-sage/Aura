<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/aura-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura</title>
    <script>
      /* Apply the persisted theme + accent BEFORE the bundle so the app (and
         this boot splash) paint in the selected theme from the first frame,
         instead of flashing the default until ThemeEngine's get_settings
         round-trip resolves a few seconds later. ThemeEngine writes both keys
         on every theme change and reconciles with the authoritative backend
         value on mount. */
      (function () {
        try {
          var t = localStorage.getItem("aura:theme");
          document.documentElement.setAttribute("data-theme", t || "mica");
          var a = localStorage.getItem("aura:accent-rgb");
          if (a) document.documentElement.style.setProperty("--boot-accent-rgb", a);
        } catch (e) {}
      })();
    </script>
    <style>
      /* ── Boot splash — shown from first DOM paint until React mounts ── */
      #aura-boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        /* FULLY opaque dark backdrop. Any alpha < 1 lets the React tree
           bleed through — even 3% bleed-through on OLED + HDR shows
           bright LandingView gradients / hero art as visible flashes.
           Solid rgb guarantees nothing behind is visible until the
           splash fades. */
        background: rgb(8, 10, 14);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        z-index: 99999;
        /* Capture pointer events so clicks can't reach React elements
           that may already be painted underneath (LandingView, login
           form, etc.). BootSplash.tsx removes this element on mount
           and takes over with the same backdrop. */
        pointer-events: auto;
        user-select: none;
      }

      #aura-boot-splash img {
        width: 96px;
        height: 96px;
        /* Slow pulse on the glow — same drop-shadow recipe as LandingView.
           Accent tracks the persisted theme via --boot-accent-rgb (set by the
           pre-paint script above); falls back to the default blue. */
        animation: boot-icon-pulse 1.6s ease-in-out infinite;
        filter: drop-shadow(0 4px 18px rgb(var(--boot-accent-rgb, 91 164 255) / 0.45));
        -webkit-user-drag: none;
      }

      #aura-boot-splash .boot-wordmark {
        font-family: "SF Pro Display", "Inter", system-ui, sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.42em;
        padding-left: 0.42em;
        text-transform: uppercase;
        /* Spectral gradient — matches .aura-title in App.css */
        background: linear-gradient(
          90deg,
          rgba(180, 210, 255, 0.92)  0%,
          rgba(220, 190, 255, 0.95) 25%,
          rgba(190, 245, 230, 0.92) 50%,
          rgba(220, 190, 255, 0.95) 75%,
          rgba(180, 210, 255, 0.92) 100%
        );
        background-size: 200% 100%;
        background-repeat: repeat-x;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        -webkit-text-stroke: 0.4px rgba(255, 255, 255, 0.08);
        filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.35))
                drop-shadow(0 0 6px rgb(var(--boot-accent-rgb, 91 164 255) / 0.18));
        animation: aura-sweep-anim 20s linear infinite;
        will-change: background-position;
      }

      @keyframes boot-icon-pulse {
        0%,  100% { filter: drop-shadow(0 4px 18px rgb(var(--boot-accent-rgb, 91 164 255) / 0.45)); }
        50%        { filter: drop-shadow(0 4px 28px rgb(var(--boot-accent-rgb, 91 164 255) / 0.75)); }
      }

      @keyframes aura-sweep-anim {
        from { background-position: 0% 50%; }
        to   { background-position: 200% 50%; }
      }
    </style>
  </head>

  <body>
    <!-- Layer A boot splash: visible immediately on DOM parse, before the JS
         bundle hydrates React. React's BootSplash component removes this
         element on mount and takes over with the React-controlled Layer B. -->
    <div id="aura-boot-splash" aria-hidden="true">
      <img src="/src/assets/aura-icon.png" alt="" draggable="false" />
      <span class="boot-wordmark">AURA</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
